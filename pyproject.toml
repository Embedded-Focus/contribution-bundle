[project]
name = "contribution-bundle"
version = "0.1.0"
description = "Source files and tooling for a Quarto/reveal.js presentation bundle"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib",
    "playwright",
    "quarto-cli",
]

[dependency-groups]
dev = [
    "ruff",
    "ty",
]

[tool.uv]
preview-features = ["audit-command"]
